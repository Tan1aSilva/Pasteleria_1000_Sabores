<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Iniciar Sesión - Pastelería Mil Sabores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pastel">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../visualizacion_catalogo/catalogo_p.html">Mil Sabores</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../visualizacion_catalogo/catalogo_p.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="../funcionalidad_carrito/carrito.html">Carrito</a></li>
            <li class="nav-item"><a class="nav-link" href="../gestion_envios/gestion.html">Envíos</a></li>
            <li class="nav-item"><a class="nav-link" href="../pro_seg_pedidos/procesamiento.html">Mis Pedidos</a></li>
          </ul>
          <div class="d-flex gap-2">
            <a href="login.html" class="btn btn-cafe btn-sm fw-bold">Iniciar Sesión</a>
            <a href="registro.html" class="btn btn-rosa btn-sm fw-bold">Registrarse</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4">
          <h4 class="fw-bold mb-3 text-purpura text-center">Iniciar Sesión</h4>

          <form id="formLogin">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="loginEmail">
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="loginPassword">
            </div>
            <button type="submit" class="btn btn-rosa w-100 fw-bold">Ingresar</button>
          </form>

          <p class="text-center mt-3 mb-0">
            ¿No tienes cuenta? <a href="registro.html" class="text-purpura">Regístrate aquí</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-pastel py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
      <small>Desarrollo Web Frontend - Duoc UC</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
