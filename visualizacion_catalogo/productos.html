<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Pastelería 1000 Sabores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="catalogo.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-pastel">
            <div class="container">
                <a class="navbar-brand fw-bold" href="productos.html">Mil Sabores</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="productos.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../funcionalidad_carrito/carrito.html">Carrito</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../gestion_envios/gestion.html">Envíos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../pro_seg_pedidos/procesamiento.html">Mis Pedidos</a>
                        </li>
                    </ul>
                    <div class="d-flex gap-2">
                        <a href="../Registro_autenticacion_usuario/login.html" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                        <a href="../Registro_autenticacion_usuario/perfil.html" class="btn btn-cafe btn-sm fw-bold">Mi Perfil</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <h1 class="text-center mb-4 fw-bold text-purpura">Pastelería 1000 Sabores</h1>

        <div class="card p-4 mb-4 border-0 shadow-sm panel-filtro">
            <h4 class="text-center mb-3 fw-bold text-cafe">Buscar y Filtrar Productos</h4>
            <input type="text" id="inputBuscar" class="form-control mb-3" placeholder="Buscar por nombre o descripción...">

            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button class="btn btn-filtro rounded-pill active" onclick="filtrarCategoria('Todas', event)">Todas</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Cuadradas', event)">Cuadradas</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Circulares', event)">Circulares</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Postres', event)">Postres</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Sin Azúcar', event)">Sin Azúcar</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Tradicional', event)">Tradicional</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Sin Gluten', event)">Sin Gluten</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Vegana', event)">Vegana</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Especiales', event)">Especiales</button>
            </div>
        </div>

        <div id="contenedorProductos" class="row g-4"></div>
    </main>

    <footer class="footer-pastel py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
            <small class="text-white-50">Desarrollo Web Frontend - Duoc UC</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
