<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Pastelería 1000 Sabores</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Externo -->
    <link rel="stylesheet" href="catalogo.css">
</head>
<body>

    <div class="container my-5">
        <h1 class="text-center mb-4 fw-bold" style="color: #8B4513;">Pastelería 1000 Sabores</h1>

        <!-- Panel de Buscador y Filtros -->
        <div class="card p-4 mb-4 border-0 shadow-sm" style="border-radius: 15px;">
            <h4 class="text-center mb-3 fw-bold" style="color: #5D4037;">Buscar y Filtrar Productos</h4>
            <input type="text" id="inputBuscar" class="form-control mb-3" placeholder="Buscar por nombre o descripción...">
            
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button class="btn btn-filtro rounded-pill active" onclick="filtrarCategoria('Todas', event)">Todas</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Cuadradas', event)">Cuadradas</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Circulares', event)">Circulares</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Postres', event)">Postres</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Sin Azúcar', event)">Sin Azúcar</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Tradicional', event)">Tradicional</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Sin Gluten', event)">Sin Gluten</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Vegana', event)">Vegana</button>
                <button class="btn btn-filtro rounded-pill" onclick="filtrarCategoria('Especiales', event)">Especiales</button>
            </div>
        </div>

        <!-- Lista Dinámica -->
        <div id="contenedorProductos" class="row g-4"></div>
    </div>

    <!-- Carga de JS -->
    <script src="data.js"></script>
    <script>
        let categoriaActual = 'Todas';

        function renderizarProductos(lista) {
            const contenedor = document.getElementById('contenedorProductos');
            contenedor.innerHTML = '';

            if (!lista || lista.length === 0) {
                contenedor.innerHTML = `<p class="text-center text-muted py-4">No se encontraron productos.</p>`;
                return;
            }

            lista.forEach(p => {
                contenedor.innerHTML += `
                    <div class="col-md-4 col-lg-3">
                        <div class="card card-producto h-100">
                            <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
                            <div class="card-body d-flex flex-column text-center">
                                <h6 class="fw-bold text-dark mb-1">${p.nombre}</h6>
                                <span class="badge bg-light text-dark mb-2 align-self-center border">${p.categoria}</span>
                                <p class="text-muted small flex-grow-1">${p.descripcion}</p>
                                <h5 class="fw-bold my-2" style="color: #8B4513;">$${p.precio.toLocaleString('es-CL')}</h5>
                                <button class="btn btn-chocolate w-100 mt-2">Añadir al Carrito</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarCategoria(cat, e) {
            categoriaActual = cat;
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('active'));
            if(e) e.target.classList.add('active');
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const texto = document.getElementById('inputBuscar').value.toLowerCase();
            const filtrados = productos.filter(p => {
                const matchesCat = (categoriaActual === 'Todas' || p.categoria === categoriaActual);
                const matchesText = p.nombre.toLowerCase().includes(texto) || p.descripcion.toLowerCase().includes(texto);
                return matchesCat && matchesText;
            });
            renderizarProductos(filtrados);
        }

        document.getElementById('inputBuscar').addEventListener('input', aplicarFiltros);
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof productos !== 'undefined') {
                renderizarProductos(productos);
            }
        });
    </script>
</body>
</html>
